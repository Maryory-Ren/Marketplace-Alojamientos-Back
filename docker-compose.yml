services:
  db:
    image: postgres:16
    container_name: marketplace-db
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}   # dev carga usuarios de prueba; en producción usar prod
      DB_URL: jdbc:postgresql://db:5432/marketplace
      DB_USER: marketplace
      DB_PASSWORD: marketplace
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-this-to-a-32-byte-minimum-value}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
